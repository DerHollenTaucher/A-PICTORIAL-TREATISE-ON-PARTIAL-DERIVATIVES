<!doctype html>
<meta charset="utf-8">
<title>phone frame · capture helper</title>
<style>
  html,body{ margin:0; background:#e9dfc7; }
  iframe{ display:block; width:390px; height:740px; border:0; }
</style>
<!-- Headless Edge clamps the window to ~492px wide, so a 390px window is a lie:
     render the mobile layout inside a true 390px iframe and crop the shot. -->
<iframe id="f" src="../index.html"></iframe>
<script>
  var q = location.search;
  if (q) document.getElementById('f').src = '../index.html' + q;
</script>
